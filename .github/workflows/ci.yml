name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Public ECR mirror of the official image. Anonymous Docker Hub pulls are rate limited.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline
      SESSION_SECRET: ci-session-secret-not-a-real-value
      ENCRYPTION_KEY: ci-encryption-key-not-a-real-value
      APP_URL: http://localhost:3000
      NODE_ENV: test
      MAIL_TRANSPORT: memory
      TRUSTED_PROXY_HOPS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Public ECR mirror of the official image. Anonymous Docker Hub pulls are rate limited.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline
      SESSION_SECRET: ci-session-secret-not-a-real-value
      ENCRYPTION_KEY: ci-encryption-key-not-a-real-value
      APP_URL: http://127.0.0.1:4173
      NODE_ENV: test
      MAIL_TRANSPORT: memory
      TRUSTED_PROXY_HOPS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Upload screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
