# One Render web service. Postgres is external Neon via DATABASE_URL.
# Do not add a Render database.
services:
  - type: web
    name: pipeline
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # 1 is correct only because Render's proxy is the sole route to the app.
      # A wrong hop count reopens IP spoofing.
      - key: TRUSTED_PROXY_HOPS
        value: '1'
